data:
  data_dir: /app/finalproject_data/train
  batch_size: 16
  num_workers: 2
  shuffle: true
model:
  model_name: EfficientNet_V2_S
  num_classes: 100
  checkpoint_path: /app/outputs/7replicator_phase1/run_20260609_043527_ed00/best_checkpoint.pth
  unfreeze_classifier_layers: 1
  unfreeze_backbone_layers: 2
optimizer:
  feature_lr: 1.0e-05
  classifier_lr: 0.0001
  weight_decay: 0.0001
training:
  epochs: 80
  seed: 42
  label_smoothing: 0.1
  cutmix_mixup_percent: 0.0
output:
  out_dir: /app/outputs/7replicator_phase2
